schema_version: 1
skill_version: 4.5.11
owner: FLOW
purpose: 《断弦之歌》六阶段唯一Workflow State与Transition Authority。
modes:
  PRODUCTION:
    formal_authority: true
  DEMO:
    formal_authority: false
  MIGRATION:
    formal_authority: false
states:
  MIGRATION_REQUIRED:
    stage: CONTROL
    terminal: false
  SOURCE_NARRATIVE_PENDING:
    stage: '01'
    terminal: false
  SOURCE_NARRATIVE_PARSED:
    stage: '01'
    terminal: false
  SCREENPLAY_ADAPTATION_DRAFT_READY:
    stage: '01'
    terminal: false
  SCREENPLAY_QC_PASSED_WAITING_APPROVAL:
    stage: '01'
    terminal: false
    user_approval_required: true
  EPISODE_SCREENPLAY_LOCKED:
    stage: '01'
    terminal: false
  DIRECTOR_INTELLIGENCE_IN_PROGRESS:
    stage: 02A
    terminal: false
  DIRECTOR_JUDGE_LOCKED:
    stage: 02A
    terminal: false
  SEQUENCE_ARC_LOCKED:
    stage: 02B
    terminal: false
  DIRECTOR_CORE_LOCKED:
    stage: 02B
    terminal: false
  DIRECTOR_BREAKDOWN_READY:
    stage: 02C
    terminal: false
  SPATIAL_CANON_IN_PROGRESS:
    stage: '03'
    terminal: false
  SPATIAL_CANON_QC_PASSED_WAITING_APPROVAL:
    stage: '03'
    terminal: false
    user_approval_required: true
  SPATIAL_CANON_LOCKED:
    stage: '03'
    terminal: false
  EPISODE_ASSET_BUILD:
    stage: '03'
    terminal: false
  DIRECTOR_GEOGRAPHY_PRECHECK_PASSED:
    stage: '03'
    terminal: false
  DIRECTOR_SPATIAL_RECONCILED:
    stage: '03'
    terminal: false
  EPISODE_ASSET_FROZEN:
    stage: '03'
    terminal: false
  EPISODE_ASSET_FREEZE_BROKEN:
    stage: '03'
    terminal: false
  STORYBOARD_IN_PROGRESS:
    stage: '04'
    terminal: false
  WAITING_PREVIOUS_ENDING_FRAME:
    stage: '04'
    terminal: false
  STORYBOARD_QC_PASSED_WAITING_APPROVAL:
    stage: '04'
    terminal: false
    user_approval_required: true
  APPROVED_PREVIS_SET:
    stage: '04'
    terminal: false
  VIDEO_GENERATION_READY:
    stage: '05'
    terminal: false
  VIDEO_TAKE_AVAILABLE:
    stage: '05'
    terminal: false
  VIDEO_QC_PASSED_WAITING_APPROVAL:
    stage: '05'
    terminal: false
    user_approval_required: true
  APPROVED_VIDEO:
    stage: '05'
    terminal: false
  ENDING_FRAME_APPROVED:
    stage: '05'
    terminal: false
  POST_IN_PROGRESS:
    stage: '06'
    terminal: false
  EPISODE_MASTER_APPROVED:
    stage: '06'
    terminal: true
  REVISE_REQUIRED:
    stage: CONTROL
    terminal: false
  VIDEO_CONDITIONING_IN_PROGRESS:
    stage: 04B
    terminal: false
  VIDEO_CONDITIONING_QC_PASSED_WAITING_APPROVAL:
    stage: 04B
    terminal: false
    user_approval_required: true
  VIDEO_CONDITIONING_READY:
    stage: 04B
    terminal: false
transitions:
- id: T00_MIGRATE
  from: MIGRATION_REQUIRED
  to: SOURCE_NARRATIVE_PENDING
  route: EXISTING_PROJECT_MIGRATION
  requires:
  - MIGRATION_COMPLETE
  note: 若已有更后阶段Approved状态，迁移器应恢复到该真实状态，而不是强制回Stage 01。
- id: T01_PARSE
  from: SOURCE_NARRATIVE_PENDING
  to: SOURCE_NARRATIVE_PARSED
  route: STAGE_01A_SOURCE_PARSE
  requires:
  - SOURCE_PARSE_PASS
- id: T02_ADAPT
  from: SOURCE_NARRATIVE_PARSED
  to: SCREENPLAY_ADAPTATION_DRAFT_READY
  route: STAGE_01B_SCREENPLAY_ADAPTATION
  requires:
  - SCREENPLAY_DRAFT_COMPLETE
- id: T03_SCREENPLAY_QC
  from: SCREENPLAY_ADAPTATION_DRAFT_READY
  to: SCREENPLAY_QC_PASSED_WAITING_APPROVAL
  route: STAGE_01C_SCREENPLAY_LOCK
  requires:
  - SCREENPLAY_QC_PASS
- id: T04_SCREENPLAY_APPROVE
  from: SCREENPLAY_QC_PASSED_WAITING_APPROVAL
  to: EPISODE_SCREENPLAY_LOCKED
  route: STAGE_01C_SCREENPLAY_LOCK
  requires:
  - USER_APPROVED_SCREENPLAY
  - SCREENPLAY_LOCK_RECORDED
- id: T05_DIRECTOR_START
  from: EPISODE_SCREENPLAY_LOCKED
  to: DIRECTOR_INTELLIGENCE_IN_PROGRESS
  route: STAGE_02A_DIRECTOR_INTELLIGENCE
  requires:
  - WORLD_STATE_AUDIT_READY
- id: T06_DIRECTOR_JUDGE
  from: DIRECTOR_INTELLIGENCE_IN_PROGRESS
  to: DIRECTOR_JUDGE_LOCKED
  route: STAGE_02A_DIRECTOR_INTELLIGENCE
  requires:
  - AUDIENCE_STATE_RESOLVED
  - DIRECTOR_OPTIONS_VALID
  - DIRECTOR_JUDGE_RESOLVED
- id: T07_SEQUENCE
  from: DIRECTOR_JUDGE_LOCKED
  to: SEQUENCE_ARC_LOCKED
  route: STAGE_02B_DIRECTOR_ARCHITECTURE
  requires:
  - SEQUENCE_ARC_PASS
- id: T08_DIRECTOR_CORE
  from: SEQUENCE_ARC_LOCKED
  to: DIRECTOR_CORE_LOCKED
  route: STAGE_02B_DIRECTOR_ARCHITECTURE
  requires:
  - DIRECTOR_ARCHITECTURE_PASS
  - SHOT_CONTRACTS_COMPLETE
  - DIRECTOR_PERCEPTION_PASS
  - EXPERIENCE_PRESSURE_PASS
  - CREATURE_PERFORMANCE_PASS
  - EXPERIENCE_COMPLETENESS_PASS
- id: T09_BREAKDOWN_READY
  from: DIRECTOR_CORE_LOCKED
  to: DIRECTOR_BREAKDOWN_READY
  route: STAGE_02C_PRODUCTION_TRANSLATION
  requires:
  - DIRECTOR_AI_BOUNDARY_RESOLVED
  - SEGMENT_PLAN_COMPLETE
  - MANDATORY_SHOT_STORYBOARD_COVERAGE_PLANNED
  - ASSET_CONSOLIDATION_PASS
  - PROVISIONAL_EPISODE_ASSET_MANIFEST_READY
  - SHOT_RELATION_GRAPH_LOCKED
  - RELATION_DRIVEN_ASSET_OBLIGATIONS_DERIVED
  - RELATION_PLANNING_VALIDATION_PASS
  - PERFORMANCE_ASSET_REQUIREMENTS_DERIVED
  - NARRATIVE_FX_REQUIREMENTS_DERIVED
  - VOICE_DIRECTION_PLAN_DERIVED
- id: T10_SPATIAL_CANON_BUILD
  from: DIRECTOR_BREAKDOWN_READY
  to: SPATIAL_CANON_IN_PROGRESS
  route: STAGE_03_SPATIAL_CANON_BUILD
  requires:
  - SPATIAL_REQUIREMENTS_DERIVED
  - EVENT_NODE_SPATIAL_BINDING_PLAN_READY
  - CHARACTER_EVENT_ROUTE_REQUIREMENTS_DERIVED
- id: T10B_SPATIAL_CANON_QC
  from: SPATIAL_CANON_IN_PROGRESS
  to: SPATIAL_CANON_QC_PASSED_WAITING_APPROVAL
  route: STAGE_03_SPATIAL_CANON_QC
  requires:
  - SPATIAL_CANON_AVAILABLE
  - SPATIAL_CANON_QC_PASS
  - SHOT_RELATION_SPATIAL_VALIDATION_PASS
  - SPATIAL_PLANNING_DIAGRAMS_QC_PASS
  - CHARACTER_EVENT_ROUTES_VALIDATED
  - REQUIRED_VIEW_SPEC_VALIDATED
  - REALISM_CONTRACT_AVAILABLE
  - REALISM_CONTRACT_QC_PASS
  - VEHICLE_FUNCTIONAL_PROFILE_VALIDATED_IF_APPLICABLE
- id: T10C_SPATIAL_CANON_APPROVE
  from: SPATIAL_CANON_QC_PASSED_WAITING_APPROVAL
  to: SPATIAL_CANON_LOCKED
  route: STAGE_03_SPATIAL_CANON_QC
  requires:
  - USER_APPROVED_SPATIAL_CANON
  - APPROVAL_RECORD_WRITTEN
  - USER_APPROVED_REQUIRED_SPATIAL_DIAGRAMS
  - REALISM_CONTRACT_LOCKED
- id: T10D_ASSET_BUILD
  from: SPATIAL_CANON_LOCKED
  to: EPISODE_ASSET_BUILD
  route: EPISODE_ASSET_BUILD
  requires:
  - SPATIAL_CANON_LOCKED
  - ASSET_QUEUE_READY
  - FINAL_EPISODE_ASSET_MANIFEST_READY
  - SPATIAL_ASSET_REQUIREMENTS_RECONCILED
  - JUSTIFIED_ASSET_QUEUE_READY
  - CASCADE_ASSET_BUILD_PLAN_READY
  - REQUIRED_VIEW_SET_READY
  - VIEW_ROLE_COVERAGE_MATRIX_READY
  - REALISM_CONTRACT_LOCKED
  - EVERYDAY_REALISM_PRECHECK_READY
- id: T11_GEOGRAPHY_PRECHECK
  from: EPISODE_ASSET_BUILD
  to: DIRECTOR_GEOGRAPHY_PRECHECK_PASSED
  route: EPISODE_ASSET_FREEZE
  requires:
  - ENVIRONMENT_GEOGRAPHY_APPROVED
  - DIRECTOR_GEOGRAPHY_PRECHECK_PASS
  conditional: true
- id: T12_SPATIAL_RECONCILE
  from_any:
  - EPISODE_ASSET_BUILD
  - DIRECTOR_GEOGRAPHY_PRECHECK_PASSED
  to: DIRECTOR_SPATIAL_RECONCILED
  route: EPISODE_ASSET_FREEZE
  requires:
  - REQUIRED_ASSETS_COMPLETE
  - DIRECTOR_SPATIAL_RECONCILIATION_PASS
  - STAGE03_RELATION_ASSET_OBLIGATIONS_FULFILLED
  - SPATIAL_CANON_LOCKED
  - JUSTIFIED_ASSET_GENERATION_PASS
  - PREDICTIVE_COVERAGE_COMPLETE
  - LOOK_DOMAIN_FREEZE_PASS
  - REQUIRED_VOICE_IDENTITY_ASSETS_RESOLVED
  - REQUIRED_VIEW_ASSET_COVERAGE_COMPLETE
  - REQUIRED_VIEW_VISUAL_REALIZATION_PASS
  - EVERYDAY_REALISM_PLAUSIBILITY_PASS
  - REALISM_RECONCILIATION_CLEAR
  - GENERATION_QUEUE_DRAINED
  - ASSET_LINEAGE_COMPLETE
  - SCENE_COLOR_AUTHORITY_COVERAGE_COMPLETE
- id: T13_FREEZE
  from: DIRECTOR_SPATIAL_RECONCILED
  to: EPISODE_ASSET_FROZEN
  route: EPISODE_ASSET_FREEZE
  requires:
  - ASSET_MANIFEST_COMPLETE
  - CHARACTER_REQUIREMENTS_COMPLETE
  - REQUIRED_SUPPORT_COMPLETE
  - REQUIRED_ASSEMBLY_COMPLETE
  - TRANSFORMATION_RECONCILED_IF_APPLICABLE
  - ASSET_QC_AND_APPROVAL_COMPLETE
  - LOCATION_RELATION_PROOF_PASS
  - RELATION_DRIVEN_STAGE03_ASSET_QC_COMPLETE
  - SPATIAL_CANON_LOCKED
  - REQUIRED_VIEW_ASSET_COVERAGE_COMPLETE
  - REQUIRED_VIEW_VISUAL_REALIZATION_PASS
  - EVERYDAY_REALISM_PLAUSIBILITY_PASS
  - REALISM_RECONCILIATION_CLEAR
  - PERFORMANCE_ASSET_COVERAGE_COMPLETE
  - NARRATIVE_FX_ASSET_COVERAGE_COMPLETE
  - ASSET_LIBRARY_COMPLETENESS_PASS
- id: T14_BREAK_FREEZE
  from_any:
  - EPISODE_ASSET_FROZEN
  - STORYBOARD_IN_PROGRESS
  - APPROVED_PREVIS_SET
  - VIDEO_GENERATION_READY
  - VIDEO_CONDITIONING_IN_PROGRESS
  - VIDEO_CONDITIONING_READY
  to: EPISODE_ASSET_FREEZE_BROKEN
  route: EPISODE_ASSET_BUILD
  requires:
  - TRUE_FORMAL_ASSET_GAP_CONFIRMED
- id: T15_REFREEZE
  from: EPISODE_ASSET_FREEZE_BROKEN
  to: EPISODE_ASSET_FROZEN
  route: EPISODE_ASSET_FREEZE
  requires:
  - MINIMUM_ASSET_GAP_FIXED
  - CHANGE_IMPACT_APPLIED
  - FREEZE_RECHECK_PASS
  - EVERYDAY_REALISM_PLAUSIBILITY_PASS
  - ASSET_LIBRARY_COMPLETENESS_PASS
- id: T16_STORYBOARD
  from: EPISODE_ASSET_FROZEN
  to: STORYBOARD_IN_PROGRESS
  route: STAGE_04_STORYBOARD
  requires:
  - REFERENCE_FIELD_COVERAGE_READY
- id: T17_WAIT_ENDING_FRAME
  from: STORYBOARD_IN_PROGRESS
  to: WAITING_PREVIOUS_ENDING_FRAME
  route: STAGE_04_STORYBOARD
  requires:
  - ENTRY_MODE_CONTINUITY_ENTRY
  - PREVIOUS_APPROVED_ENDING_FRAME_MISSING
  conditional: true
- id: T18_RESUME_STORYBOARD
  from: WAITING_PREVIOUS_ENDING_FRAME
  to: STORYBOARD_IN_PROGRESS
  route: STAGE_04_STORYBOARD
  requires:
  - PREVIOUS_APPROVED_ENDING_FRAME_AVAILABLE
- id: T19_STORYBOARD_QC
  from: STORYBOARD_IN_PROGRESS
  to: STORYBOARD_QC_PASSED_WAITING_APPROVAL
  route: STAGE_04_STORYBOARD
  requires:
  - MANDATORY_STORYBOARD_QC_COVERAGE_PASS
  - STORYBOARD_QC_PASS
  - SHOT_RELATION_STORYBOARD_ALIGNMENT_PASS
  - STORYBOARD_EVERYDAY_REALISM_PASS
  - STORYBOARD_GENERATION_JOBS_QC_READY
  - STORYBOARD_SEQUENCE_GRID_QC_PASS
  - STORYBOARD_ENTITY_BINDING_PASS
  - EXPERIENCE_STORYBOARD_COVERAGE_PASS
- id: T20_STORYBOARD_APPROVE
  from: STORYBOARD_QC_PASSED_WAITING_APPROVAL
  to: APPROVED_PREVIS_SET
  route: STAGE_04_STORYBOARD
  requires:
  - USER_APPROVED_STORYBOARD
  - APPROVAL_RECORD_WRITTEN
  - STORYBOARD_GENERATION_JOBS_PROMOTED
  - MANDATORY_STORYBOARD_APPROVED_COVERAGE_PASS
  - STORYBOARD_SEQUENCE_GRID_APPROVED_PASS
- id: T21_CONDITIONING_BUILD
  from: APPROVED_PREVIS_SET
  to: VIDEO_CONDITIONING_IN_PROGRESS
  route: STAGE_04_VIDEO_CONDITIONING_BUILD
  requires:
  - VIDEO_CONDITIONING_PLAN_RESOLVED
  - BOUNDARY_PAIR_PLAN_RESOLVED
  - GENERATION_ENVELOPE_RESOLVED
  - MULTISHOT_STORYBOARD_GRID_GATE_PASS
- id: T22_CONDITIONING_QC
  from: VIDEO_CONDITIONING_IN_PROGRESS
  to: VIDEO_CONDITIONING_QC_PASSED_WAITING_APPROVAL
  route: STAGE_04_VIDEO_CONDITIONING_QC
  requires:
  - VIDEO_CONDITIONING_ASSETS_AVAILABLE
  - VIDEO_CONDITIONING_QC_PASS
  - IDENTITY_READABILITY_PASS
  - SHOT_RELATION_CONDITIONING_ALIGNMENT_PASS
  - VIDEO_CONDITIONING_EVERYDAY_REALISM_PASS
  - SHOT_EXECUTION_GENERATION_JOBS_COMPLETE
  - VIDEO_CONDITIONING_COLOR_BINDING_PASS
- id: T23_CONDITIONING_APPROVE
  from: VIDEO_CONDITIONING_QC_PASSED_WAITING_APPROVAL
  to: VIDEO_CONDITIONING_READY
  route: STAGE_04_VIDEO_CONDITIONING_QC
  requires:
  - USER_APPROVED_VIDEO_CONDITIONING
  - APPROVAL_RECORD_WRITTEN
- id: T23B_VIDEO_READY
  from: VIDEO_CONDITIONING_READY
  to: VIDEO_GENERATION_READY
  route: STAGE_05_VIDEO
  requires:
  - VIDEO_CONDITIONING_READY_PASS
  - IDENTITY_READABILITY_PASS
  - VIDEO_READINESS_PASS
  - RELATION_DRIVEN_VIDEO_CONDITIONING_PASS
  - EVERYDAY_REALISM_PRE_VIDEO_PASS
  - VIDEO_COLOR_AUTHORITY_BOUND
  - VIDEO_EXECUTION_PLAN_PASS
  - LONG_VIDEO_QUOTA_CONFIRMATION_PASS
  - VIDEO_EXECUTION_PLAN_FINGERPRINT_CURRENT
  - FINAL_VIDEO_PROMPT_VALID
  - STORYBOARD_TO_VIDEO_PROMPT_HANDOFF_PASS
  - VIDEO_ENTITY_BINDING_HANDOFF_PASS
  - VIDEO_REFERENCE_MEDIA_POLICY_PASS
  - AUDIO_REFERENCE_BINDING_PASS
  - VIDEO_GENERATION_JOB_PROMPT_BOUND
  - GENERATION_ENVELOPE_VALID
  - MULTISHOT_STORYBOARD_GRID_GATE_PASS
  - VOICE_DIRECTION_PLAN_PASS
  - VOICE_DIRECTION_PROMPT_HANDOFF_PASS
  - EXPERIENCE_VIDEO_PROMPT_HANDOFF_PASS
  conditional_requires:
    TEXT_ONLY_CONTINUATION:
    - REFERENCE_VISUAL_EVIDENCE_PASS
    TEMPORAL_SAME_TAKE:
    - CONTINUITY_SNAPSHOT_PASS
    - TEMPORAL_ENTRY_PLAN_PASS
    - TEMPORAL_T0_SUFFICIENCY_PASS
- id: T24_VIDEO_TAKE
  from: VIDEO_GENERATION_READY
  to: VIDEO_TAKE_AVAILABLE
  route: STAGE_05_VIDEO
  requires:
  - REAL_VIDEO_TAKE_AVAILABLE
- id: T25_VIDEO_QC
  from: VIDEO_TAKE_AVAILABLE
  to: VIDEO_QC_PASSED_WAITING_APPROVAL
  route: STAGE_05_VIDEO_QC
  requires:
  - VIDEO_QC_PASS
  - VIDEO_EVERYDAY_REALISM_QC_PASS
  - VIDEO_EXPERIENCE_EXECUTION_QC_PASS
  - VIDEO_CREATURE_PERFORMANCE_QC_PASS
- id: T26_VIDEO_APPROVE
  from: VIDEO_QC_PASSED_WAITING_APPROVAL
  to: APPROVED_VIDEO
  route: STAGE_05_VIDEO_QC
  requires:
  - USER_APPROVED_VIDEO
  - APPROVAL_RECORD_WRITTEN
- id: T27_ENDING_FRAME
  from: APPROVED_VIDEO
  to: ENDING_FRAME_APPROVED
  route: STAGE_05_ENDING_FRAME
  requires:
  - REAL_ENDING_FRAME_EXTRACTED
  - CONTINUITY_SNAPSHOT_PASS
- id: T27B_ADVANCE_VIDEO_UNIT
  from: ENDING_FRAME_APPROVED
  to: STORYBOARD_IN_PROGRESS
  route: ADVANCE_VIDEO_UNIT
  requires:
  - NEXT_VIDEO_UNIT_AVAILABLE
  - CURRENT_VIDEO_UNIT_ADVANCED
  - CONTINUITY_ENTRY_WRITTEN
  conditional: true
- id: T28_POST
  from: ENDING_FRAME_APPROVED
  to: POST_IN_PROGRESS
  route: STAGE_06_POST
  requires:
  - REQUIRED_SEGMENTS_APPROVED
  - NO_REMAINING_VIDEO_UNITS
- id: T29_MASTER
  from: POST_IN_PROGRESS
  to: EPISODE_MASTER_APPROVED
  route: STAGE_06_POST
  requires:
  - MASTER_QC_PASS
  - USER_APPROVED_MASTER
  - VOICE_TTS_HANDOFF_PASS
initial_state_by_mode:
  PRODUCTION: SOURCE_NARRATIVE_PENDING
  DEMO: SOURCE_NARRATIVE_PENDING
  MIGRATION: MIGRATION_REQUIRED
