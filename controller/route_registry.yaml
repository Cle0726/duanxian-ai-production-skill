  metadata_inventory_before_pixel_review: REQUIRED
  max_review_long_edge: 1600
  contact_sheet_final_acceptance_allowed: false
runtime_types:
- STORY_RUNTIME
- DIRECTOR_RUNTIME
- ASSET_RUNTIME
- SCENE_RUNTIME
- SPATIAL_CANON_RUNTIME
- REALISM_RUNTIME
- REFERENCE_RUNTIME
- VISUAL_EVIDENCE_RUNTIME
