schema_version: 1
skill_version: 4.5.11
owner: ROUTE
purpose: 唯一Task→Runtime→Fallback Source映射。Route只决定加载集合，不重复领域规则。
always_on:
- controller/workflow_state_machine.yaml
- controller/authority_registry.yaml
- templates/system_integrity_authority.md
- controller/gate_producer_registry.yaml
- SKILL.md
visual_review_preflight:
