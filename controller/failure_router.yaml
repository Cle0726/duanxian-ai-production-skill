schema_version: 1
skill_version: 4.5.11
owner: FAILURE_ROUTE
principle: Minimum Necessary Rollback；先定位Owner，再重开最小范围，不默认从头重做。
routes:
  ASSET_COVERAGE_GAP:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    - REFERENCE_RUNTIME
  LEGACY_COVERAGE_ASSET_REQUIRES_MIGRATION:
    owner_stage: '03'
    route: EXISTING_PROJECT_MIGRATION
    reopen:
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: 将旧 ENVIRONMENT_MASTER/PROP_MASTER coverage 记录迁移为 ENVIRONMENT_COVERAGE，并保留来源与审核状态。
  IDENTITY_READABILITY_FAIL:
    owner_stage: 04/05
    route: STAGE_04_VIDEO_CONDITIONING_QC
    reopen:
    - VIDEO_CONDITIONING_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    - REFERENCE_RUNTIME
    action: DIRECT_BIND_CHARACTER_IDENTITY_AUTHORITY_OR_REGENERATE_READABLE_PRIMARY
  IDENTITY_READABILITY_EVIDENCE_BASIS_FAIL:
    owner_stage: '04'
    route: STAGE_04_VIDEO_CONDITIONING_QC
    reopen:
    - VISUAL_EVIDENCE_RUNTIME
    action: REASSESS_AT_PLATFORM_EFFECTIVE_SCALE
  CHARACTER_IDENTITY_LOCK_GAP:
    owner_stage: '03'
    route: CHARACTER_MASTER
    reopen:
    - ASSET_RUNTIME
  ADORNMENT_ASSET_GAP:
    owner_stage: '03'
    route: CHARACTER_MASTER
    reopen:
    - ASSET_RUNTIME
  ENVIRONMENT_FUNCTIONAL_GEOGRAPHY_CONFLICT:
    owner_stage: '03'
    route: EPISODE_ASSET_FREEZE
    reopen:
    - DIRECTOR_RUNTIME
    - ASSET_RUNTIME
    - SCENE_RUNTIME
  EPISODE_ASSET_FREEZE_BROKEN:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    - SCENE_RUNTIME
    - REFERENCE_RUNTIME
  DIRECTOR_SHOT_CONTRACT_CONFLICT:
    owner_stage: '02'
    route: STAGE_02B_DIRECTOR_ARCHITECTURE
    reopen:
    - DIRECTOR_RUNTIME
  DIRECTOR_INVARIANT_SILENT_DRIFT:
    owner_stage: '02'
    route: STAGE_02B_DIRECTOR_ARCHITECTURE
    reopen:
    - DIRECTOR_RUNTIME
    - VIDEO_RUNTIME
  REFERENCE_COVERAGE_GAP:
    owner_stage: 03/04
    route: PRODUCTION_SUPPORT_REFERENCE
    reopen:
    - ASSET_RUNTIME
    - REFERENCE_RUNTIME
  STORYBOARD_ENTITY_BINDING_CONFLICT:
    owner_stage: '04'
    route: STAGE_04_STORYBOARD
    reopen:
    - DIRECTOR_RUNTIME
    - REFERENCE_RUNTIME
    action: PATCH_OFF_IMAGE_BINDING_MAP_ONLY_THEN_REVALIDATE
  VIDEO_ENTITY_BINDING_HANDOFF_FAIL:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
    - REFERENCE_RUNTIME
    action: RERESOLVE_ENTITY_BINDING_AND_FRESH_COMPILE
  REFERENCE_SLOT_OVERFLOW:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - REFERENCE_RUNTIME
    - VIDEO_RUNTIME
  ACTION_FEASIBILITY_FAIL:
    owner_stage: 04/05
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
  NATURAL_MOTION_FAIL:
    owner_stage: 04/05
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
  CROWD_PRESENCE_FAIL:
    owner_stage: 04/05
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
  PROMPT_REDUNDANCY_FAIL:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
    action: FRESH_COMPILE
  POST_COMPILE_CLOSURE_FAIL:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
    action: FRESH_COMPILE
  VIDEO_EXECUTION_PLAN_FAIL:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
    - REFERENCE_RUNTIME
    action: RETURN_TO_EXECUTION_PLAN_AND_RESOLVE_MINIMUM_CONFLICT
  VIDEO_EXECUTION_FAIL:
    owner_stage: '05'
    route: REVISION_VIDEO
    reopen:
    - VIDEO_RUNTIME
    - QC_RUNTIME
  VIDEO_PARTIAL_SALVAGE:
    owner_stage: 05/06
    route: STAGE_05_VIDEO_QC
    reopen:
    - QC_RUNTIME
    action: TEMPORAL_SALVAGE_ANALYSIS
  STALE_PROMPT_ARTIFACT:
    owner_stage: '05'
    route: STAGE_05_VIDEO
    reopen:
    - VIDEO_RUNTIME
    action: FRESH_COMPILE
  AUTHORITY_VERSION_CHANGED:
    owner_stage: CONTROL
    route: EXISTING_PROJECT_MIGRATION
    action: CHANGE_IMPACT_THEN_MINIMUM_REBUILD
  SHOT_RELATION_GRAPH_GAP:
    owner_stage: '02'
    route: STAGE_02C_PRODUCTION_TRANSLATION
    reopen:
    - DIRECTOR_RUNTIME
    action: 补齐相邻Shot的Cut Motivation / Attention Target / World Relation后重新派生资产义务。
  RELATION_ASSET_OBLIGATION_GAP:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    - SCENE_RUNTIME
    action: 只补缺失的Clue / Sightline / Location Identity / Coverage资产，不重做无关Canon。
  SHOT_RELATION_STORYBOARD_MISMATCH:
    owner_stage: '04'
    route: STAGE_04_STORYBOARD
    reopen:
    - DIRECTOR_RUNTIME
    - SCENE_RUNTIME
    - REFERENCE_RUNTIME
    action: 修正Storyboard，使Attention Target、Reveal、POV、Match或Cut关系在相邻Panel中可读。
  CUT_PAIR_ALIGNMENT_FAIL:
    owner_stage: 04B
    route: STAGE_04_VIDEO_CONDITIONING_BUILD
    reopen:
    - VIDEO_CONDITIONING_RUNTIME
    - REFERENCE_RUNTIME
    action: 只重做/调整受影响的Exit/Entry/First/Target静态执行帧，先证明边界关系。
  SPATIAL_CANON_CONFLICT:
    owner_stage: 03A
    route: STAGE_03_SPATIAL_CANON_BUILD
    reopen:
    - SPATIAL_CANON_RUNTIME
    - SCENE_RUNTIME
    action: 修正Topology/Floor Plan/Sightline/Access等空间事实后重新验证Shot Relation；不先生成视觉资产。
  SHOT_RELATION_SPATIAL_CONTRADICTION:
    owner_stage: 02/03A
    route: STAGE_03_SPATIAL_CANON_QC
    reopen:
    - DIRECTOR_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: 先判断是Director关系错误还是Spatial Canon错误；只改真正Owner，禁止用图片强行掩盖空间矛盾。
  VISUAL_EVIDENCE_MISSING:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - VISUAL_EVIDENCE_RUNTIME
    - REFERENCE_RUNTIME
    action: 只把阻断当前任务的资产加入VISUAL_REVIEW_QUEUE；Text-only Controller不得猜图片内容。
  VISUAL_EVIDENCE_STALE:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - VISUAL_EVIDENCE_RUNTIME
    - REFERENCE_RUNTIME
    action: 资产Fingerprint变化，重新视觉审计该版本；旧Evidence不得继续用于@资产选择。
  VISUAL_FACT_CONFLICT:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: PRODUCTION_SUPPORT_REFERENCE
    reopen:
    - VISUAL_EVIDENCE_RUNTIME
    - REFERENCE_RUNTIME
    action: 当前资产实际视觉事实与Shot需求冲突；换用有证据的其它资产或补最小静态资产，不改Canon来迁就错误图片。
  REQUIRED_VIEW_COVERAGE_GAP:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: 只补缺失的Required View；先用View Coverage Matrix确认Camera Origin→Optical Axis→Must See，不重做已正确的其它方向。
  REQUIRED_VIEW_VISUAL_MISMATCH:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Prompt/文件名声称的视角不算完成；根据Observed View Role/Camera Axis/Visible Anchors只重做错误视角，并重写Visual Evidence。
  COVERAGE_BUDGET_STARVATION:
    owner_stage: '03'
    route: EPISODE_ASSET_BUILD
    reopen:
    - ASSET_RUNTIME
    action: 仍有Required View为MISSING时，禁止继续为已覆盖方向堆候选；先生成缺失P0/P1视角。
  REALISM_CONTRACT_CONFLICT:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: 先修普通现实基线/Vehicle Functional Profile/人物功能位置；若Source明确则不得用图片改Canon。
  ENVIRONMENT_REALISM_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: 先判断Spatial Canon是否本身不现实；Canon正确则拒绝错误Candidate，只重做受影响Environment/Coverage。
  VEHICLE_REALISM_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: 核对具体Vehicle Type、驾驶区、乘员区、出入口、通道、容量与前后方向；禁止把Vehicle当普通房间自由重排。
  HUMAN_SPATIAL_REALISM_FAIL:
    owner_stage: 03/04
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: 核对人物数量、身份、Zone/Seat、支撑面、人体尺度、Reach与穿插；Canon正确则只重做/局部修补错误人物落位。
  SOCIAL_SPATIAL_PLAUSIBILITY_FAIL:
    owner_stage: 02/03/04
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - DIRECTOR_RUNTIME
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    action: 先确认异常距离/朝向是否有剧情理由；无理由则修Blocking/资产，有明确导演理由则记录behavior_reason_ref。
  MUNDANE_CONTINUITY_REALISM_FAIL:
    owner_stage: 02/03/04/05
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - SCENE_RUNTIME
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    action: 回查World State的换位/持物/湿度/门窗/任务来源，禁止用CUT或新图当Reset。
  REALISM_VISUAL_EVIDENCE_GAP:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - REALISM_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: 只审当前P0/P1现实性被阻断的资产；纯文本模型不得根据Prompt猜现实性PASS。
  VIEW_ASSET_REALISM_CONTRACT_GAP:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Bind the candidate to every Realism Contract required by its View Requirement before it can count as coverage.
  REQUIRED_VIEW_REALISM_CONTRACT_GAP:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: A selected view cannot bypass ordinary-reality contracts; repair the binding or replace the asset.
  REQUIRED_VIEW_REALISM_QC_NOT_PASS:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Correct camera direction is insufficient; the selected fulfillment asset must also pass Everyday Realism QC.
  REALISM_CONTRACT_NOT_LOCKED:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Lock or repair the governing REALISM_CONTRACT before any dependent image generation.
  REALISM_CONTRACT_UNKNOWN_LOCATION:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Repair the contract-to-location binding; do not invent a location from the generated image.
  REALISM_CONTRACT_UNKNOWN_EVENT_NODE:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Repair Event Node grounding before downstream assets are generated.
  REALISM_EVENT_LOCATION_MISMATCH:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Reconcile the Event Node location with Source/Spatial Canon, then rederive only affected assets.
  REALISM_EXCEPTION_UNSCOPED:
    owner_stage: CONTROL
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Replace broad realism waiver with an explicit local scope and allowed categories.
  REALISM_EXCEPTION_EMPTY:
    owner_stage: CONTROL
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Declare exact waived realism categories or remove the exception.
  REALISM_EXCEPTION_OVERBROAD_WITHOUT_APPROVAL:
    owner_stage: CONTROL
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Broad all-category realism waivers require explicit approval and local scope.
  REALISM_EXCEPTION_MODE_WITHOUT_SCOPE:
    owner_stage: CONTROL
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Add a concrete transformation/combat/supernatural/dream/surreal scope; fantasy genre alone is not an exception.
  REALISM_REQUIRED_ZONE_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Repair required Zone in Spatial Canon before generation.
  REALISM_REQUIRED_ANCHOR_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Repair required functional Anchor in Spatial Canon before generation.
  CHARACTER_REQUIRED_ZONE_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Ground the character to a real Zone before creating a seated/standing visual.
  CHARACTER_FUNCTIONAL_POSITION_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Define the real functional position/seat/control point first.
  CHARACTER_SUPPORT_SURFACE_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Define the support surface before asking a character to sit/lean/stand on it.
  VEHICLE_PROFILE_LOCATION_KIND_MISMATCH:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Treat the location as a VEHICLE with a concrete vehicle type, not a generic room.
  VEHICLE_TYPE_UNSPECIFIED:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    action: Resolve a concrete vehicle type from Source/period/function before layout generation.
  VEHICLE_DRIVER_ZONE_UNSPECIFIED:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Define the driver/control Zone before generating the cabin.
  VEHICLE_PASSENGER_ZONES_UNSPECIFIED:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Define real passenger Zones/capacity before generating the cabin.
  VEHICLE_ZONE_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Repair vehicle Zone references in Spatial Canon.
  VEHICLE_ENTRY_ANCHOR_UNKNOWN:
    owner_stage: 03A
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    action: Define a plausible vehicle entry/exit anchor and circulation path.
  CAST_COUNT_MISMATCH:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Reject the candidate; restore expected cast cardinality and regenerate only the affected asset.
  CHARACTER_DUPLICATION_OR_COUNT_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Reject duplicated/missing character realization; do not normalize the error into Canon.
  CHARACTER_ZONE_ASSIGNMENT_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Regenerate/patch the character into the required real Zone; do not move the Zone to fit a pretty image.
  CHARACTER_FUNCTIONAL_POSITION_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Restore the required seat/control/work position and regenerate only the affected candidate.
  CHARACTER_POSTURE_REALISM_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    action: Correct posture against support surface/available clearance before downstream use.
  ERGONOMIC_SUPPORT_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Reject impossible sitting/leaning/standing support and repair the minimum affected asset.
  HUMAN_ENVIRONMENT_INTERSECTION_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Reject human/furniture/wall intersection and regenerate or locally edit the affected visual.
  HUMAN_SCALE_IMPLAUSIBLE:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: Check Canon dimensions first; if Canon is sane, reject the generated scale drift.
  SPACE_CAPACITY_EXCEEDED:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: Respect seat/Zone/aisle capacity; do not enlarge the world implicitly to fit extra people.
  SPACE_REQUIRED_OCCUPANCY_MISSING:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    action: Restore required functional occupancy or repair the source contract if the requirement was wrong.
  VEHICLE_FUNCTIONAL_LAYOUT_DRIFT:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Reject vehicle-to-generic-room/tram/cabin drift; restore the locked vehicle type, driver/passenger zones, circulation and capacity.
  VEHICLE_DRIVER_ZONE_DRIFT:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: Restore the locked driver/control Zone and view/access geometry.
  VEHICLE_TYPE_VISUALLY_UNPROVEN:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - REALISM_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Visually verify the concrete vehicle type before approval or @asset reuse.
  ENVIRONMENT_KIND_VISUAL_MISMATCH:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: Reject the candidate if it depicts the wrong functional environment kind.
  ENVIRONMENT_FUNCTIONAL_TYPE_DRIFT:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - SPATIAL_CANON_RUNTIME
    - ASSET_RUNTIME
    action: Restore the locked real-world functional type rather than accepting a visually attractive substitution.
  OBJECT_AFFORDANCE_FAIL:
    owner_stage: '03'
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Repair reachability/support/operability of the object in the affected visual.
  OBJECT_AFFORDANCE_UNPROVEN:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - REALISM_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Obtain visual evidence for object usability before approval.
  SOCIAL_SPATIAL_IMPLAUSIBILITY:
    owner_stage: 02/03/04
    route: EVERYDAY_REALISM_RECONCILIATION
    reopen:
    - DIRECTOR_RUNTIME
    - REALISM_RUNTIME
    - ASSET_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Ordinary people should occupy plausible conversational/personal distance and interaction access unless an explicit behavior reason
      exists.
  SOCIAL_SPATIAL_RELATION_UNPROVEN:
    owner_stage: CURRENT_VISUAL_DEPENDENCY
    route: VISUAL_EVIDENCE_CAPTURE
    reopen:
    - REALISM_RUNTIME
    - VISUAL_EVIDENCE_RUNTIME
    action: Verify ordinary social distance/interaction access when it is a P0/P1 requirement.
  SOCIAL_EYELINE_ACCESS_FAIL:
