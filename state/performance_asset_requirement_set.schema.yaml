$schema: https://json-schema.org/draft/2020-12/schema
$id: duanxian/performance_asset_requirement_set.schema.yaml
title: Duanxian Performance Asset Requirement Set V1
type: object
additionalProperties: false
required:
- schema_version
- skill_version
- episode_id
- requirements
- status
properties:
  schema_version:
    type: integer
    const: 1
  skill_version:
    type: string
    pattern: ^4\.5\.(7|11)$
  episode_id:
    type: string
    minLength: 1
  requirements:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - requirement_id
      - entity_id
      - actor_class
      - readability
      - shot_ids
      - requirement_type
      - trigger_codes
      - reason
      - fulfill_by
      - support_asset_ids
      - status
      properties:
        requirement_id:
          type: string
          minLength: 1
        entity_id:
          type: string
          minLength: 1
        actor_class:
          enum:
          - CHARACTER_CANON
          - MINOR_HUMAN
        readability:
          enum:
          - READABLE
          - SILHOUETTE_READABLE
        scene_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        shot_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        requirement_type:
          enum:
          - NONE
          - EXPRESSION_SUPPORT
          - ACTION_POSE_SUPPORT
          - CONTACT_POSE_SUPPORT
          - PERFORMANCE_SUPPORT_PACK
        trigger_codes:
          type: array
          uniqueItems: true
          items:
            enum:
            - EXPRESSION_IS_STORY_PAYLOAD
            - MICRO_EXPRESSION_CRITICAL
            - NON_NEUTRAL_POSE
            - COMPLEX_BODY_MECHANICS
            - CONTACT_RELATION
            - PROP_HANDLING
            - REPEATED_PERFORMANCE_SHAPE
            - OTHER
        reason:
          type: string
          minLength: 1
        fulfill_by:
          enum:
          - STAGE_03_FREEZE
        interaction_entity_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        support_asset_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        status:
          enum:
          - NOT_REQUIRED
          - REQUIRED
          - IN_PROGRESS
          - APPROVED
          - STALE
          - BLOCKED
  status:
    enum:
    - PLANNED
    - READY_FOR_BUILD
    - FROZEN
    - STALE
    - BLOCKED
  fingerprint:
    type:
    - string
    - 'null'
