$schema: https://json-schema.org/draft/2020-12/schema
$id: duanxian/minor_human_canon_view_set.schema.yaml
title: Duanxian Minor Human Canon View Set
type: object
required:
- schema_version
- skill_version
- asset_scope
- identity_mode
- views
properties:
  schema_version:
    type: integer
    const: 1
  skill_version:
    type: string
    pattern: ^4\.5\.(7|11)$
  asset_scope:
    enum:
    - MINOR_HUMAN_CANON_VIEW_SET
    - CROWD_ARCHETYPE_SET
  identity_mode:
    enum:
    - ANONYMOUS_FUNCTIONAL
    - READABLE_SINGLE_HUMAN
    - CROWD_ARCHETYPE
  source_brief_ref:
    type:
    - string
    - 'null'
  views:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - view_id
      - view_role
      properties:
        view_id:
          type: string
        view_role:
          enum:
          - FRONT_OR_3Q
          - REVERSE_OR_3Q
          - BODY_SILHOUETTE
          - SIDE_OPTIONAL
          - POSE_OPTIONAL
        view_yaw_deg:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        asset_id:
          type:
          - string
          - 'null'
  crowd_archetypes:
    type: array
    items:
      type: object
      properties:
        archetype_id:
          type: string
        label:
          type: string
