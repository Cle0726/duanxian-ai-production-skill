$schema: https://json-schema.org/draft/2020-12/schema
$id: duanxian/context_load_plan.schema.yaml
title: Duanxian Context Load Plan
type: object
additionalProperties: false
required:
- schema_version
- skill_version
- context_load_plan_id
- route_id
- runtime_state
- active_capabilities
- active_module_packs
- dependency_expansions
- kernel_files
- runtime_types
- creative_context_files
- machine_validation_files
- excluded_conditional_domains
- source_fallback_loaded
- plan_fingerprint
properties:
  schema_version: {type: integer, const: 1}
  skill_version: {type: string, pattern: '^4[.]5[.]11$'}
  context_load_plan_id: {type: string, minLength: 1}
  route_id: {type: string, minLength: 1}
  runtime_state: {enum: [FRESH, MISSING, STALE, INCOMPLETE]}
  active_capabilities:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  active_module_packs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  dependency_expansions:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  matched_conditional_domains:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  kernel_files:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  runtime_types:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  structured_inputs:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  creative_context_files:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  machine_validation_files:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  machine_control_plane_files:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  excluded_conditional_domains:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  forbidden_context:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  source_fallback_loaded: {type: boolean}
  soft_file_count_exceeded: {type: boolean}
  notes:
    type: array
    items: {type: string}
  plan_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  runtime_freshness_proof:
    type:
    - object
    - 'null'
    additionalProperties: true
