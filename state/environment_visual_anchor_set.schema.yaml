$schema: https://json-schema.org/draft/2020-12/schema
$id: duanxian/environment_visual_anchor_set.schema.yaml
title: Duanxian Environment Visual Anchor Set
type: object
required:
- schema_version
- skill_version
- environment_id
- closure_status
- anchors
properties:
  schema_version:
    type: integer
    const: 1
  skill_version:
    type: string
    pattern: ^4\.5\.(7|11)$
  environment_id:
    type: string
  closure_status:
    enum:
    - OPEN
    - PARTIAL
    - CLOSED
  anchors:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - anchor_id
      - camera_zone
      - optical_axis
      - must_see_anchors
      properties:
        anchor_id:
          type: string
        camera_zone:
          type: string
        optical_axis_deg:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        optical_axis:
          type: string
        must_see_anchors:
          type: array
          minItems: 1
          items:
            type: string
        covered_surfaces:
          type: array
          items:
            type: string
        asset_id:
          type:
          - string
          - 'null'
