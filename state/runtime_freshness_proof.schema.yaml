$schema: https://json-schema.org/draft/2020-12/schema
$id: duanxian/runtime_freshness_proof.schema.yaml
title: Duanxian Runtime Freshness Proof
type: object
additionalProperties: false
required:
- schema_version
- skill_version
- route_id
- resolved_runtime_state
- expected_runtime_types
- expected_scope
- runtime_evidence
- proof_fingerprint
properties:
  schema_version: {type: integer, const: 1}
  skill_version: {type: string, const: '4.5.11'}
  route_id: {type: string, minLength: 1}
  resolved_runtime_state: {enum: [FRESH, MISSING, STALE, INCOMPLETE]}
  expected_runtime_types:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  expected_scope: {type: object, minProperties: 1, additionalProperties: true}
  runtime_evidence:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [runtime_type, fresh, issues]
      properties:
        runtime_type: {type: string, minLength: 1}
        fresh: {type: boolean}
        issues:
          type: array
          items: {type: string}
  proof_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
