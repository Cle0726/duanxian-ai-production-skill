name: Bootstrap Skill Source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.tar.xz.b64
          base64 --decode .bootstrap/source.tar.xz.b64 > /tmp/duanxian-source.tar.xz
          mkdir -p /tmp/duanxian-source
          tar -xJf /tmp/duanxian-source.tar.xz -C /tmp/duanxian-source
          rsync -a --exclude='.git' --exclude='.gitignore' /tmp/duanxian-source/ ./
          rm -rf .bootstrap

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: publish v4.5.7 production workflow skill'
            git push origin HEAD:main
          fi
